[project]
name = "ia-enginner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vini", email = "vinicius_gentile@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain>=1.3.16",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tavily-python>=0.8.1",
]

[project.scripts]
ia-enginner = "ia_enginner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
